<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orbit Garden</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffd27a'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%237ad7ff' stroke-width='2'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#05050d;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hud{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#9fb0d8;font-size:13px;letter-spacing:.04em;pointer-events:none;transition:opacity 1.5s;text-shadow:0 0 6px #000}
  #hud.dim{opacity:.25}
  #tag{position:fixed;top:10px;left:14px;color:#cdd7f5;font-size:15px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">Orbit Garden</div>
<div id="hud">klik / tik = zaadje planten · spatie = pauze · R = reset · S = PNG opslaan</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var hud = document.getElementById('hud');
  var W = 0, H = 0, dpr = 1;
  var paused = false, seeds = [], wells = [], time = 0;
  var MAX = 90, BG = '5,5,13';

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    // behoud de sporen bij resize
    var keep = null;
    if (W && cv.width) {
      keep = document.createElement('canvas'); keep.width = cv.width; keep.height = cv.height;
      keep.getContext('2d').drawImage(cv, 0, 0);
    }
    W = w; H = h;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgb(' + BG + ')'; ctx.fillRect(0, 0, W, H);
    if (keep) ctx.drawImage(keep, 0, 0, W, H);
    layoutWells();
  }

  function layoutWells() {
    var m = Math.min(W, H);
    var defs = [[0.5, 0.5, 1.0], [0.5 - 0.3 * W / m, 0.5 - 0.12, 0.55], [0.5 + 0.3 * W / m, 0.5 + 0.12, 0.7]];
    if (W < H) defs = [[0.5, 0.5, 1.0], [0.28, 0.25, 0.55], [0.72, 0.75, 0.7]];
    wells = defs.map(function (d, i) {
      return { x: Math.min(Math.max(d[0], 0.12), 0.88) * W, y: Math.min(Math.max(d[1], 0.1), 0.9) * H,
               mass: d[2], hue: [38, 190, 320][i] };
    });
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function plant(x, y) {
    // wordt een planeetje met een baan om de dichtstbijzijnde bron (gewogen op zwaartekracht)
    var best = null, bf = -1;
    for (var i = 0; i < wells.length; i++) {
      var dx = wells[i].x - x, dy = wells[i].y - y, d2 = dx * dx + dy * dy + 400;
      var f = wells[i].mass / d2;
      if (f > bf) { bf = f; best = wells[i]; }
    }
    var dx = best.x - x, dy = best.y - y, d = Math.sqrt(dx * dx + dy * dy) + 1;
    var G = gravity(best);
    var vc = Math.sqrt(G / d) * d / Math.sqrt(d * d + 900) * Math.sqrt(1) ; // ~cirkelsnelheid
    var dir = Math.random() < 0.5 ? 1 : -1;
    var speed = vc * rnd(0.55, 1.15);
    var vx = -dy / d * speed * dir, vy = dx / d * speed * dir;
    if (seeds.length >= MAX) seeds.shift();
    seeds.push({ x: x, y: y, px: x, py: y, vx: vx, vy: vy, hue: (best.hue + rnd(-40, 60) + 360) % 360,
                 r: rnd(2.2, 4.2), age: 0, life: rnd(60, 140), bloom: 1 });
  }

  function gravity(w) { return 2.2e6 * w.mass * Math.min(W, H) / 800; }

  function step(dt) {
    var sub = 4, h = dt / sub;
    for (var s = 0; s < sub; s++) {
      for (var i = 0; i < seeds.length; i++) {
        var p = seeds[i], ax = 0, ay = 0;
        for (var k = 0; k < wells.length; k++) {
          var w = wells[k], dx = w.x - p.x, dy = w.y - p.y;
          var d2 = dx * dx + dy * dy + 900, inv = gravity(w) / (d2 * Math.sqrt(d2));
          ax += dx * inv; ay += dy * inv;
        }
        p.vx += ax * h; p.vy += ay * h;
        p.x += p.vx * h; p.y += p.vy * h;
      }
    }
    for (var j = seeds.length - 1; j >= 0; j--) {
      var q = seeds[j]; q.age += dt;
      var out = q.x < -300 || q.x > W + 300 || q.y < -300 || q.y > H + 300;
      var speed2 = q.vx * q.vx + q.vy * q.vy;
      if (out || q.age > q.life || !isFinite(q.x) || speed2 > 1e7) seeds.splice(j, 1);
    }
  }

  function draw() {
    // langzaam vervagen
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(' + BG + ',' + 0.006 + ')';
    if (!paused) ctx.fillRect(0, 0, W, H);
    // sporen
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = 0; i < seeds.length; i++) {
      var p = seeds[i];
      var fade = Math.max(0, 1 - p.age / p.life);
      ctx.strokeStyle = 'hsla(' + ((p.hue + p.age * 6) % 360) + ',90%,62%,' + (0.55 * fade + 0.12) + ')';
      ctx.lineWidth = p.r * 0.5;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      p.px = p.x; p.py = p.y;
    }
    // bronnen en planeetjes (op de sporen; worden elk frame ververst via overlay)
  }

  var overlay = function () {
    // glow van bronnen + planeten wordt direct getekend; de volgende fade-pass dooft ze weer
    ctx.globalCompositeOperation = 'lighter';
    for (var k = 0; k < wells.length; k++) {
      var w = wells[k], r = 26 * (0.6 + w.mass * 0.5) * (1 + 0.06 * Math.sin(time * 2 + k));
      var g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, r * 2.2);
      g.addColorStop(0, 'hsla(' + w.hue + ',100%,85%,0.9)');
      g.addColorStop(0.25, 'hsla(' + w.hue + ',100%,60%,0.35)');
      g.addColorStop(1, 'hsla(' + w.hue + ',100%,50%,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w.x, w.y, r * 2.2, 0, 6.2832); ctx.fill();
    }
    for (var i = 0; i < seeds.length; i++) {
      var p = seeds[i], fade = Math.max(0.15, 1 - p.age / p.life);
      var rr = p.r * (1 + 1.5 * Math.max(0, 1 - p.age * 1.5));
      var gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr * 3);
      gg.addColorStop(0, 'hsla(' + p.hue + ',100%,90%,' + fade + ')');
      gg.addColorStop(0.4, 'hsla(' + p.hue + ',100%,65%,' + 0.4 * fade + ')');
      gg.addColorStop(1, 'hsla(' + p.hue + ',100%,50%,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, rr * 3, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  };

  // Planeet- en bronglows horen niet in de permanente sporen: teken ze op een
  // tijdelijke laag door het sporenbeeld te bewaren en terug te zetten.
  var buf = document.createElement('canvas'), bctx = buf.getContext('2d');

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (!paused) { time += dt; step(dt * 1.0); }
    draw();
    // snapshot van sporen, overlay erop, tonen, daarna sporen herstellen
    if (buf.width !== cv.width || buf.height !== cv.height) { buf.width = cv.width; buf.height = cv.height; }
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.globalCompositeOperation = 'copy';
    bctx.drawImage(cv, 0, 0);
    overlay();
    // toon-frame staat nu op cv; zet trails terug voor de volgende pass
    shown = true;
    requestAnimationFrame(function (t) {
      // herstel sporen zonder overlay
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'copy'; ctx.drawImage(buf, 0, 0); ctx.restore();
      frame(t);
    });
  }
  var shown = false;

  function savePNG() {
    cv.toBlob(function (b) {
      if (!b) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'orbit-garden-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
  }

  function reset() {
    seeds = [];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgb(' + BG + ')'; ctx.fillRect(0, 0, W, H);
    bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.globalCompositeOperation = 'copy'; bctx.drawImage(cv, 0, 0);
    seedIntro();
  }

  function seedIntro() {
    for (var i = 0; i < 7; i++) plant(rnd(0.15, 0.85) * W, rnd(0.15, 0.85) * H);
  }

  function hideHint() { hud.classList.add('dim'); }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); plant(e.clientX, e.clientY); hideHint();
  });
  cv.addEventListener('pointermove', function (e) {
    if (e.buttons && e.pointerType === 'mouse' && Math.random() < 0.3) plant(e.clientX, e.clientY);
  });
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); paused = !paused; }
    else if (k === 'r') reset();
    else if (k === 's') savePNG();
  });
  window.addEventListener('resize', resize);

  resize();
  seedIntro();
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
</body>
</html>
